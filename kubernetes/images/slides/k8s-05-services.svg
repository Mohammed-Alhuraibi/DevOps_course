<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Introduction to Kubernetes, slide 6 of 12: Services</title><desc id="d">Services: callers (the Ingress for /api, or any pod at http://backend:3000) reach the Service backend, which selects every ready pod labelled app=backend and spreads the calls; when a pod is replaced it gets a new IP but the name stays, like a company phone number that rings any free agent.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.08"/></filter></defs><rect width="1600" height="900" fill="#FFFFFF"/><!-- Generated by kubernetes/images/src/build_k8s_slides.py - edit the script, not this file. Logos from Simple Icons (simpleicons.org); trademarks of their owners, used only to identify the technologies. Git Logo by Jason Long, CC BY 3.0. Debian logo (c) Software in the Public Interest, CC BY-SA 3.0. Let's Encrypt logo (c) ISRG, CC BY-NC 4.0. --><text x="80" y="112" font-size="52" font-weight="800" fill="#111827" letter-spacing="-0.8">Services</text><text x="80" y="158" font-size="24" fill="#4B5563">One stable name in front of changing pods. It finds them by label and spreads the calls.</text><path transform="translate(80 836) scale(1.1667)" fill="#326CE5" d="M10.204 14.35l.007.01-.999 2.413a5.171 5.171 0 0 1-2.075-2.597l2.578-.437.004.005a.44.44 0 0 1 .484.606zm-.833-2.129a.44.44 0 0 0 .173-.756l.002-.011L7.585 9.7a5.143 5.143 0 0 0-.73 3.255l2.514-.725.002-.009zm1.145-1.98a.44.44 0 0 0 .699-.337l.01-.005.15-2.62a5.144 5.144 0 0 0-3.01 1.442l2.147 1.523.004-.002zm.76 2.75l.723.349.722-.347.18-.78-.5-.623h-.804l-.5.623.179.779zm1.5-3.095a.44.44 0 0 0 .7.336l.008.003 2.134-1.513a5.188 5.188 0 0 0-2.992-1.442l.148 2.615.002.001zm