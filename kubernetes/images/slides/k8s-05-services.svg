 697.83 142.5 695.67 Q123 689.17 115.2 667.5 Q113.47 658.83 117.37 655.37Z" fill="#111827"/><text x="184" y="672" font-size="26" font-weight="800" fill="#111827">Like a company phone number</text><text x="184" y="708" font-size="21" fill="#374151">You call one number and any free agent answers. Agents can change; the number never does.</text><text x="184" y="754" font-size="20" fill="#374151">Inside the cluster, DNS turns the name</text><text x="560.96" y="754" font-size="20" font-weight="700" fill="#111827" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" textLength="84" lengthAdjust="spacingAndGlyphs">backend</text><text x="656.96" y="754" font-size="20" fill="#374151">into the Service's fixed IP: no pod IP is ever typed by hand.</text></svg>
