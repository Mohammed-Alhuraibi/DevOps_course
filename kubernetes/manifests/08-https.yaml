# Step 9 (part 1) - ask Google for an HTTPS certificate.
# No certbot this time: a ManagedCertificate asks Google to issue (and
# renew) a certificate for k8s.gulfheight.com. Google can only do that once
# the name points to our load balancer's IP (the DNS record of step 9), and
# it takes 15-60 minutes. The site keeps working on plain HTTP meanwhile.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: bugsquash-cert
spec:
  domains:
    - k8s.gulfheight.com
---
# The Ingress of step 8, plus ONE annotation that attaches the certificate.
# "kubectl apply" updates the existing Ingress in place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugsquash
  annotations:
    kubernetes.io/ingress.global-static-ip-name: bugsquash-ip
    networking.gke.io/managed-certificates: bugsquash-cert
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
